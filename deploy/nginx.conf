# Nginx 反向代理（ppt.meridion.com），证书可用 certbot 申请
server {
    listen 80;
    server_name ppt.meridion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ppt.meridion.com;

    ssl_certificate     /etc/letsencrypt/live/ppt.meridion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppt.meridion.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI 生成可能需要几十秒
        proxy_read_timeout 120s;
    }
}
